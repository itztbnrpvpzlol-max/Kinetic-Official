[package]
name = "kinetic-effectcraft-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "kinetic_effectcraft"
crate-type = ["cdylib"]

[dependencies]
effectcraft-engine = { path = "../../third_party/effectcraft/crates/engine" }
effectcraft-media = { path = "../../third_party/effectcraft/crates/media" }
jni = "0.21.1"
serde_json = "1"
# Pin to EffectCraft upstream lockfile; zip 9.7.x currently fails Android ARM libc mode checks.
zip = "=9.1.3"

# EffectCraft's pinned craft-pdf revision requires the matching Hayro fork APIs.
# Keep these patches at the top-level JNI crate because Cargo applies patches
# from the consuming workspace root.
[patch.crates-io]
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "808730f49b9637b7909fe2ae56f9d63fdb100cae", version = "=0.7.2" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "808730f49b9637b7909fe2ae56f9d63fdb100cae", version = "=0.3.0" }
