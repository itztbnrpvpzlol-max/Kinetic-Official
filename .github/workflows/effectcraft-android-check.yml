name: EffectCraft Android native check

on:
  push:
    branches:
      - feat/effectcraft-android-integration
    paths:
      - "native/effectcraft-android/**"
      - "third_party/effectcraft"
      - ".gitmodules"
      - ".github/workflows/effectcraft-android-check.yml"
      - "app/src/main/cpp/**"
      - "app/src/main/java/**"
      - "app/src/main/res/**"
      - "app/build.gradle.kts"
  pull_request:
    branches:
      - feat/effectcraft-android-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effectcraft-android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ffmpeg:
    name: Build FFmpeg (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
    steps:
      - name: Checkout Kinetic
        uses: actions/checkout@v4

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ndk;26.1.10909125

      - name: Install FFmpeg build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm yasm gnupg
          test -x "${ANDROID_HOME}/ndk/26.1.10909125/ndk-build"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "${GITHUB_ENV}"

      - name: Cache FFmpeg native libraries
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/ffmpeg/prebuilt/${{ matrix.abi }}
          key: kinetic-ffmpeg-9.0.2-${{ matrix.abi }}-ndk26.1.10909125-v1

      - name: Build FFmpeg from verified upstream source
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash app/src/main/cpp/build-ffmpeg-android.sh "${{ matrix.abi }}"

      - name: Verify FFmpeg output
        shell: bash
        run: |
          set -euo pipefail
          ROOT="app/src/main/cpp/ffmpeg/prebuilt/${{ matrix.abi }}"
          test -s "${ROOT}/include/libavcodec/avcodec.h"
          test -s "${ROOT}/include/libavcodec/mediacodec.h"
          for library in avformat avcodec swscale avutil; do
            test -s "${ROOT}/lib${library}.so"
          done

      - name: Upload FFmpeg libraries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.abi }}
          path: app/src/main/cpp/ffmpeg/prebuilt
          if-no-files-found: error
          retention-days: 1

  android-arm64:
    name: Build Kinetic APK with EffectCraft (arm64-v8a)
    needs: build-ffmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Kinetic and pinned EffectCraft source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download FFmpeg native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          path: app/src/main/cpp/ffmpeg/prebuilt
          merge-multiple: true

      - name: Install Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "${GITHUB_ENV}"

      - name: Install Rust 1.95 and Android target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Compile EffectCraft JNI for Android arm64
        working-directory: native/effectcraft-android
        run: cargo ndk -t arm64-v8a build --release

      - name: Package EffectCraft JNI library for Android
        shell: bash
        run: |
          set -euo pipefail
          LIBRARY="$(find native/effectcraft-android target -path '*/aarch64-linux-android/release/libkinetic_effectcraft.so' -print -quit 2>/dev/null || true)"
          test -n "${LIBRARY}"
          test -s "${LIBRARY}"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "${LIBRARY}" app/src/main/jniLibs/arm64-v8a/libkinetic_effectcraft.so

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Kinetic Android APK with EffectCraft packaged
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify EffectCraft is inside the APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "${APK}"
          unzip -l "${APK}" | grep -F 'lib/arm64-v8a/libkinetic_effectcraft.so'

      - name: Upload Kinetic debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-effectcraft-arm64-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
