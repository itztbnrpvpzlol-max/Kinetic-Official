name: Kinetic Android APK

on:
  push:
    branches:
      - migration/files-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kinetic-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ffmpeg:
    name: Build FFmpeg (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm yasm gnupg
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            if { yes || true; } | "${SDKMANAGER}" --install "ndk;26.1.10909125"; then
              test -x "${ANDROID_HOME}/ndk/26.1.10909125/ndk-build"
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Android NDK installation failed after 3 attempts."
              exit 1
            fi
            sleep 10
          done
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "${GITHUB_ENV}"

      - name: Cache FFmpeg native libraries
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/ffmpeg/prebuilt/${{ matrix.abi }}
          key: kinetic-ffmpeg-9.0.2-${{ matrix.abi }}-ndk26.1.10909125-v1

      - name: Build FFmpeg from verified upstream source
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash app/src/main/cpp/build-ffmpeg-android.sh "${{ matrix.abi }}"

      - name: Upload FFmpeg libraries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.abi }}
          path: app/src/main/cpp/ffmpeg/prebuilt
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build debug APK
    needs: build-ffmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download FFmpeg native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          path: app/src/main/cpp/ffmpeg/prebuilt
          merge-multiple: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            rm -rf "${ANDROID_HOME}/ndk/26.1.10909125"
            if { yes || true; } | "${SDKMANAGER}" --install "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"; then
              test -x "${ANDROID_HOME}/ndk/26.1.10909125/ndk-build"
              test -d "${ANDROID_HOME}/platforms/android-36"
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Android NDK installation failed after 3 attempts."
              exit 1
            fi
            sleep 10
          done

      - name: Calculate unique APK version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          VERSION_NAME="0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "KINETIC_VERSION_CODE=${VERSION_CODE}" >> "${GITHUB_ENV}"
          echo "KINETIC_VERSION_NAME=${VERSION_NAME}" >> "${GITHUB_ENV}"
          echo "Building Kinetic ${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Verify FFmpeg ABI outputs
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s "app/src/main/cpp/ffmpeg/prebuilt/${abi}/libavformat.so"
            test -s "app/src/main/cpp/ffmpeg/prebuilt/${abi}/libavcodec.so"
            test -s "app/src/main/cpp/ffmpeg/prebuilt/${abi}/libswscale.so"
            test -s "app/src/main/cpp/ffmpeg/prebuilt/${abi}/libavutil.so"
            test -s "app/src/main/cpp/ffmpeg/prebuilt/${abi}/include/libavcodec/mediacodec.h"
          done

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          rustc --version

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            native/effectcraft-android/target
          key: kinetic-effectcraft-${{ hashFiles('native/effectcraft-android/Cargo.lock') }}-v1

      - name: Build EffectCraft engine (all ABIs)
        shell: bash
        working-directory: native/effectcraft-android
        run: |
          set -euo pipefail
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/26.1.10909125"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 \
            -o ../../app/src/main/jniLibs build --release --locked
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s "../../app/src/main/jniLibs/${abi}/libkinetic_effectcraft.so"
          done

      - name: Prepare persistent APK signing key
        shell: bash
        env:
          KINETIC_KEYSTORE_BASE64: ${{ secrets.KINETIC_KEYSTORE_BASE64 }}
          KINETIC_KEYSTORE_PASSWORD: ${{ secrets.KINETIC_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KINETIC_KEYSTORE_BASE64}" || { echo "Missing KINETIC_KEYSTORE_BASE64 repository secret."; exit 1; }
          test -n "${KINETIC_KEYSTORE_PASSWORD}" || { echo "Missing KINETIC_KEYSTORE_PASSWORD repository secret."; exit 1; }
          printf '%s' "${KINETIC_KEYSTORE_BASE64}" | base64 --decode > app/kinetic-upload.jks
          keytool -list -keystore app/kinetic-upload.jks -storepass "${KINETIC_KEYSTORE_PASSWORD}" -alias kinetic-upload >/dev/null
          echo "KINETIC_KEYSTORE_PASSWORD=${KINETIC_KEYSTORE_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Build optimized APK
        shell: bash
        run: |
          set -o pipefail
          STATUS=0
          gradle assembleOptimized --no-daemon -PKINETIC_VERSION_CODE="${KINETIC_VERSION_CODE}" -PKINETIC_VERSION_NAME="${KINETIC_VERSION_NAME}" 2>&1 | tee build.log || STATUS=$?
          if [ "${STATUS}" -ne 0 ]; then
            # Surface compiler errors as annotations so they are readable without opening the raw log.
            ERRORS=$(grep -E '^e: ' build.log | head -25 | sed -E 's#file:///[^ ]*/com/kinetic/app/##' | paste -sd '~' - || true)
            WENT_WRONG=$(grep -A6 'What went wrong' build.log | head -8 | paste -sd '~' - || true)
            echo "::error title=Kotlin errors::${ERRORS}"
            echo "::error title=Gradle::${WENT_WRONG}"
          fi
          exit "${STATUS}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-optimized-apk
          path: app/build/outputs/apk/optimized/*.apk
          if-no-files-found: error
          retention-days: 7
