name: Kinetic Android APK

on:
  push:
    branches:
      - feature/native-render-audio-overhaul
      - migration/files-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kinetic-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          # sdkmanager exits after accepting the licenses, which closes the
          # input pipe. Keep that expected SIGPIPE from failing the step while
          # still propagating sdkmanager's actual exit status.
          for attempt in 1 2 3; do
            rm -rf "${ANDROID_HOME}/ndk/26.1.10909125"
            if { yes || true; } | "${SDKMANAGER}" --install "ndk;26.1.10909125" "cmake;3.22.1"; then
              test -x "${ANDROID_HOME}/ndk/26.1.10909125/ndk-build"
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Android NDK installation failed after 3 attempts."
              exit 1
            fi
            sleep 10
          done

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
