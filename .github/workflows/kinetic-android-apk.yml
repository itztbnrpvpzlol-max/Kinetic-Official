name: Kinetic Android APK

on:
  push:
    branches:
      - migration/files-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kinetic-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ffmpeg:
    name: Build FFmpeg (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm yasm gnupg
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            if { yes || true; } | "${SDKMANAGER}" --install "ndk;26.1.10909125"; then
              test -x "${ANDROID_HOME}/ndk/26.1.10909125/ndk-build"
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Android NDK installation failed after 3 attempts."
              exit 1
            fi
            sleep 10
          done
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> "${GITHUB_ENV}"

      - name: Cache FFmpeg native libraries
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/ffmpeg/prebuilt/${{ matrix.abi }}
          key: kinetic-ffmpeg-9.0.2-${{ matrix.abi }}-ndk26.1.10909125-v1

      - name: Build FFmpeg from verified upstream source
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash app/src/main/cpp/build-ffmpeg-android.sh "${{ matrix.abi }}"

      - name: Upload FFmpeg libraries
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.abi }}
          path: app/src/main/cpp/ffmpeg/prebuilt
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build debug APK
    needs: build-ffmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download FFmpeg native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: ffmpeg-*
          path: app/src/main/cpp/ffmpeg/prebuilt
          merge-multiple: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            rm -rf "${ANDROID_HOME}/ndk/26.1.10909125"
            if { yes || true; } | "${SDKMANAGER}" --install "platforms;android-36" "build-tools;36.0.0" "ndk;26.1.10909125" "cmake;3.22.1"; then
              test -x "${ANDROID_HOME}/ndk/26.1.10909125/ndk-build"
              test -d "${ANDROID_HOME}/platforms/android-36"
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Android NDK installation failed after 3 attempts."
              exit 1
            fi
            sleep 10
          done

      - name: Calculate unique APK version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          VERSION_NAME="0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "KINETIC_VERSION_CODE=${VERSION_CODE}" >> "${GITHUB_ENV}"
          echo "KINETIC_VERSION_NAME=${VERSION_NAME}" >> "${GITHUB_ENV}"
          echo "Building Kinetic ${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Verify FFmpeg ABI outputs
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -s "app/src/main/cpp/ffmpeg/prebuilt/${abi}/libavformat.so"
            test -s "app/src/main/cpp/ffmpeg/prebuilt/${abi}/libavcodec.so"
            test -s "app/src/main/cpp/ffmpeg/prebuilt/${abi}/libswscale.so"
            test -s "app/src/main/cpp/ffmpeg/prebuilt/${abi}/libavutil.so"
            test -s "app/src/main/cpp/ffmpeg/prebuilt/${abi}/include/libavcodec/mediacodec.h"
          done

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -PKINETIC_VERSION_CODE="${KINETIC_VERSION_CODE}" -PKINETIC_VERSION_NAME="${KINETIC_VERSION_NAME}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
